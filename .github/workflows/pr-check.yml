name: pr-check
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        shell: bash {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cargo test --locked --all-targets > /tmp/build.log 2>&1
          code=$?
          echo "cargo test exit=$code"
          if [ "$code" -ne 0 ]; then
            python3 .github/post_log.py
          fi
          exit "$code"
