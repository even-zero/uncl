name: release

# dev tests, increments the base-99 version, and builds a draft release.
# master only publishes the newest draft and its exact source to crates.io.
on:
  push:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub and crates.io (otherwise create a draft)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 4

jobs:
  guard:
    if: >-
      !github.event.repository.fork
      && ((github.event_name == 'push' && github.ref == 'refs/heads/dev')
          || (github.event_name == 'workflow_dispatch' && inputs.publish != true && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect unreleased code (commit titles never suppress fixes)
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare to the newest draft source, falling back to the public
          # release. Commit titles never suppress a fix (including squash PRs).
          tag="$(gh release list --limit 100 --json tagName,isDraft -q 'first(.[] | select(.isDraft)) | .tagName // empty')"
          base=""
          if [ -n "$tag" ]; then
            base="$(gh release view "$tag" --json targetCommitish -q .targetCommitish)"
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$base^{commit}"
          else
            base="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName // empty')"
          fi
          if [ -z "$base" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- src Cargo.toml Cargo.lock; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  prepare:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit
      - name: Allocate version and persist the exact release source
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          # Base 99: PATCH and MINOR range from 0 through 98.
          next_version() {
            local major minor patch
            IFS=. read -r major minor patch <<< "$1"
            major=$((10#$major)); minor=$((10#$minor)); patch=$((10#$patch))
            minor=$((minor + (patch + 1) / 99))
            patch=$(((patch + 1) % 99))
            major=$((major + minor / 99))
            minor=$((minor % 99))
            printf '%s.%s.%s\n' "$major" "$minor" "$patch"
          }
          # Keep rollover regression tests beside the actual implementation.
          test "$(next_version 0.1.15)" = 0.1.16
          test "$(next_version 0.1.98)" = 0.2.0
          test "$(next_version 0.98.98)" = 1.0.0
          current="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          # Include drafts so a replacement never reuses a reserved number.
          drafts="$(gh release list --limit 100 --json tagName -q '.[].tagName')"
          previous="$( { printf '%s\n' "$current" "$drafts"; git tag --list 'v*'; } |
            sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          version="$(next_version "$previous")"
          cargo set-version "$version"
          sed -i -E "s/^v[0-9]+\.[0-9]+\.[0-9]+$/v$version/" readme.md
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock readme.md
          git commit -m "chore: release v$version"
          # GITHUB_TOKEN pushes do not trigger another workflow. No magic skip
          # marker that could accidentally suppress a later squash-merged fix.
          # A concurrent push rejects this update rather than shipping stale code.
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    # Keep `${{ matrix.slug }}` out of `name:`: when `build` is skipped (e.g. on
    # `master` or docs-only pushes), GitHub Actions skips matrix expansion and
    # renders any `matrix.*` expression in `name:` verbatim. Making `slug` the
    # matrix axis names active jobs `build (<slug>)` and skipped ones `build`.
    name: build
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # A missing platform is a broken download, not a smaller release.
      fail-fast: true
      matrix:
        slug:
          - linux-x86_64
          - windows-x86_64
          - macos-aarch64
          - macos-x86_64
        include:
          # 22.04 on purpose: a binary built against a newer glibc refuses to
          # start on every older distribution.
          - { slug: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { slug: windows-x86_64, os: windows-2022, target: x86_64-pc-windows-msvc }
          # Both macOS targets build on an arm64 runner: the SDK is universal,
          # so the Intel slice is a cross-compile with no extra setup.
          - { slug: macos-aarch64, os: macos-15, target: aarch64-apple-darwin }
          - { slug: macos-x86_64, os: macos-15, target: x86_64-apple-darwin }
    steps:
      # The release commit, not the triggering one: after a bump, the version in
      # Cargo.toml and Cargo.lock only agree on the new commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: stage
        shell: bash
        run: |
          set -euo pipefail
          name="uncl-${{ matrix.slug }}"
          bin="target/${{ matrix.target }}/release/uncl"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          mkdir -p "dist/$name"
          cp "$bin" "dist/$name/"
          cp readme.md LICENSE "dist/$name/"
          ls -l "dist/$name"

      - name: package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="uncl-${{ matrix.slug }}"
          # tar keeps the executable bit; a bare binary loses it on download.
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          tar -tzvf "dist/$name.tar.gz"

      - name: package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "uncl-${{ matrix.slug }}"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: uncl-${{ matrix.slug }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          # Release staging only needs to live as long as the release itself;
          # don't let the default 90 day retention linger in the artifacts tab.
          retention-days: 7

  draft:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft from this run only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" dist/* --draft --target "$SHA" --title "uncl v$VERSION" --generate-notes
      - name: Remove superseded drafts after the new one is ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          while read -r old; do
            [ -z "$old" ] || [ "$old" = "$TAG" ] || gh release delete "$old" --yes
          done < <(gh release list --limit 100 --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName')

  publish:
    if: >-
      !github.event.repository.fork
      && github.ref == 'refs/heads/master'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Select the newest dev draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(gh release list --limit 100 --json tagName,isDraft -q 'first(.[] | select(.isDraft)) | .tagName // empty')"
          if [ -z "$tag" ]; then
            echo '::error::No draft to publish. Run the release workflow on dev first.'
            exit 1
          fi
          sha="$(gh release view "$tag" --json targetCommitish -q .targetCommitish)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.draft.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate before making GitHub release public
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_HTTP_LOW_SPEED_LIMIT: '0'
          CARGO_HTTP_TIMEOUT: '300'
          VERSION: ${{ steps.draft.outputs.version }}
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "$manifest_version" = "$VERSION"
          test -n "$CARGO_REGISTRY_TOKEN" || { echo '::error::CARGO_REGISTRY_TOKEN is missing'; exit 1; }
          # Fail closed on registry outages; only a confirmed 404 means absent.
          status="$(curl -sS -o /tmp/crate.json -w '%{http_code}' -H 'User-Agent: uncl-release' "https://crates.io/api/v1/crates/uncl/$VERSION")"
          case "$status" in
            200) echo 'Version already published' ;;
            404) cargo publish --locked ;;
            *) echo "::error::crates.io returned $status"; exit 1 ;;
          esac
      - name: Publish the selected draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.draft.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false --latest
