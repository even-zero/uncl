[package]
name = "uncl"
version = "0.1.14"
edition = "2024"
description = "a single, toggleable, resizable floating terminal window as an accomplice to your worst terminal misdeeds"
readme = "readme.md"
license = "MIT"
repository = "https://github.com/even-zero/uncl"
homepage = "https://github.com/even-zero/uncl"
keywords = ["terminal", "multiplexer", "tui", "shell", "window"]
categories = ["command-line-utilities", "command-line-interface", "operating-systems"]

[dependencies]
crossterm = "0.29"
portable-pty = "0.8.1"
anyhow = "1.0.98"
vt100 = "0.18.1"
tokio = { version = "1.44.2", features = ["full"] }
bytes = "1.11.1"
